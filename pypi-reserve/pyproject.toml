[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "loggetta"
version = "0.0.1"
description = "Preview reservation release for Loggetta, which turns a workload, a machine, and constraints into an inspectable execution plan."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Jordan Anderson" }]
keywords = ["machine-learning", "llm", "gpu", "planning", "qlora", "moe"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Source = "https://github.com/pjordanandrsn/loggetta"
Issues = "https://github.com/pjordanandrsn/loggetta/issues"

[tool.setuptools.packages.find]
where = ["src"]
include = ["loggetta*"]
