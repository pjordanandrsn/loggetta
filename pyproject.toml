[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "loggetta"
version = "0.1.0"
description = "Turn a workload, machine, and constraints into an inspectable execution plan for large-model training and serving."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Jordan Anderson" }]
keywords = ["machine-learning", "llm", "gpu", "planning", "qlora", "moe"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# The core (hardware inventory, planner, ExecutionPlan, ExecutionReceipt, execution orchestration) is pure Python.
# How anything runs (models, adapters, engines, kernels) comes from the backend packages, which stay independently
# installable and usable on their own.
dependencies = []

[project.optional-dependencies]
# experts4bit-qlora 0.48.0 carries `arch.topology`, `recipe` and `serve_recipe`; grouped-nf4-gemm 0.41.0 carries
# `nf4_route.route_for`. The serve estimate's later items (RESULTS 6b-6e) arrive in experts4bit-qlora's next release.
experts4bit = [
  "experts4bit-qlora[train,fast]>=0.48.0",
  "grouped-nf4-gemm>=0.41.0",
  "datasets",
]
test = ["pytest>=7"]

[project.scripts]
loggetta = "loggetta.cli:main"

[project.urls]
Source = "https://github.com/pjordanandrsn/loggetta"
Issues = "https://github.com/pjordanandrsn/loggetta/issues"

[tool.setuptools.packages.find]
include = ["loggetta*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["gpu: needs a CUDA device and downloads/loads a real model"]
