[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "loggetta"
version = "0.3.1"
description = "Plan and run Mixture-of-Experts fine-tuning on one GPU: check the machine, fit the model, and keep a report of each run."
readme = "PYPI.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Jordan Anderson" }]
keywords = ["machine-learning", "llm", "gpu", "planning", "qlora", "moe"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# The core (hardware inventory, planner, ExecutionPlan, ExecutionReceipt, execution orchestration) is pure Python.
# How anything runs (models, adapters, engines, kernels) comes from the backend packages, which stay independently
# installable and usable on their own.
dependencies = [
  "experts4bit-qlora[train,fast]>=0.49.0",
  "grouped-nf4-gemm>=0.41.0",
  "datasets",
  "peft>=0.21.2",
]

[project.optional-dependencies]
# Compatibility alias for the 0.1.0 install spelling. The backend stack is now installed by default.
experts4bit = []
test = ["pytest>=7"]

[project.scripts]
loggetta = "loggetta.cli:main"

[project.urls]
Source = "https://github.com/pjordanandrsn/loggetta"
Issues = "https://github.com/pjordanandrsn/loggetta/issues"

[tool.setuptools.packages.find]
include = ["loggetta*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["gpu: needs a CUDA device and downloads/loads a real model"]
