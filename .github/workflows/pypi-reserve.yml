name: Publish Loggetta to PyPI

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi-reserve
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build distribution
        run: |
          python -m pip install --upgrade build twine
          python -m build --outdir dist
          python -m twine check dist/*

      - name: Smoke test wheel
        run: |
          python -m venv /tmp/loggetta-release
          WHEEL=$(echo dist/*.whl)
          /tmp/loggetta-release/bin/pip install "$WHEEL"
          # Import the installed wheel, never the source tree left in the working directory.
          cd "$(mktemp -d)"
          /tmp/loggetta-release/bin/python - <<'PY2'
          from importlib.metadata import version
          import loggetta
          from loggetta import TrainingData, load_adapter
          from loggetta.backends.experts4bit_adapters import read_manifest
          assert callable(load_adapter) and callable(read_manifest)
          assert TrainingData(source="org/data").repeat is False
          assert loggetta.__version__ == version("loggetta")
          print("loggetta", loggetta.__version__)
          PY2
          /tmp/loggetta-release/bin/loggetta --help >/dev/null

      - name: Publish to PyPI with Trusted Publishing
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
