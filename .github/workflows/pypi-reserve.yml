name: Reserve loggetta on PyPI

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi-reserve
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build reservation distribution
        run: |
          python -m pip install --upgrade build
          python -m build pypi-reserve --outdir dist

      - name: Smoke test wheel
        run: |
          python -m venv /tmp/loggetta-reserve
          /tmp/loggetta-reserve/bin/pip install dist/*.whl
          /tmp/loggetta-reserve/bin/python -c "import loggetta; assert loggetta.__version__ == '0.0.1'"

      - name: Publish to PyPI with Trusted Publishing
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
