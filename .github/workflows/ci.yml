name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - python-version: "3.10"
            extras: "test"
            lane: "core"
          - python-version: "3.12"
            extras: "test,experts4bit"
            lane: "released backend"
    name: test (${{ matrix.python-version }}, ${{ matrix.lane }})
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[${{ matrix.extras }}]"
      - name: Test
        run: pytest -q
      - name: The absmax digest regression must run, not skip (#47)
        if: matrix.lane == 'released backend'
        run: |
          pytest -q -rs tests/test_absmax_digest.py | tee absmax-digest.out
          grep -q "3 passed" absmax-digest.out && ! grep -q -i "skipped" absmax-digest.out
